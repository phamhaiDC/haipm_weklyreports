<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Command Center — Dcorp Core Tech</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #003087; --navy-dark: #001f5e; --gold: #E8B84B;
    --bg: #f5f6fa; --surface: #ffffff; --border: #e2e5ee;
    --text: #1a1d2e; --muted: #6b7080; --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  body { font-family: 'Segoe UI','IBM Plex Sans',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { background:var(--navy); color:#fff; padding:0 2rem; height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,48,135,.18); }
  .logo { font-size:15px; font-weight:600; display:flex; align-items:center; gap:10px; }
  .logo-dot { width:8px; height:8px; background:var(--gold); border-radius:50%; }
  #conn-status { font-size:12px; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#aaa; }
  .dot.ok { background:#4caf50; } .dot.err { background:#f44336; }
  .dot.loading { background:var(--gold); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .tabs { display:flex; border-bottom:1px solid var(--border); background:var(--surface); padding:0 2rem; position:sticky; top:56px; z-index:99; }
  .tab { padding:14px 22px; font-size:14px; font-weight:500; cursor:pointer; border:none; background:none; color:var(--muted); border-bottom:2px solid transparent; transition:all .15s; }
  .tab:hover { color:var(--navy); } .tab.active { color:var(--navy); border-bottom-color:var(--navy); }
  .content { max-width:1100px; margin:0 auto; padding:1.5rem 2rem 3rem; }
  .toolbar { display:flex; gap:8px; margin-bottom:1.25rem; flex-wrap:wrap; align-items:center; }
  .toolbar input,.toolbar select { height:36px; padding:0 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--text); background:var(--surface); outline:none; transition:border-color .15s; }
  .toolbar input:focus,.toolbar select:focus { border-color:var(--navy); }
  .toolbar input.wide { flex:1; min-width:160px; }
  .btn { height:36px; padding:0 14px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; transition:all .15s; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:var(--navy); color:#fff; } .btn-primary:hover:not(:disabled) { background:var(--navy-dark); }
  .filter-row { display:flex; gap:6px; margin-bottom:1rem; flex-wrap:wrap; }
  .chip { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--muted); transition:all .12s; }
  .chip.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  .file-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .file-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); }
  .fc-top { display:flex; justify-content:space-between; align-items:center; }
  .tag { font-size:11px; font-weight:600; padding:2px 9px; border-radius:10px; }
  .tag-vti{background:#e8f0ff;color:#1a4aa0;} .tag-dcorp{background:#f0eaff;color:#5534b0;} .tag-client{background:#e6f9f0;color:#0d6e47;} .tag-other{background:#f1f1f1;color:#555;}
  .fc-name { font-size:14px; font-weight:600; color:var(--text); }
  .fc-desc { font-size:12px; color:var(--muted); }
  .fc-link { font-size:12px; color:var(--navy); text-decoration:none; display:flex; align-items:center; gap:5px; font-weight:500; }
  .fc-link:hover { text-decoration:underline; }
  .icon-btn { background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; border-radius:5px; display:flex; align-items:center; }
  .icon-btn:hover { background:#fce4e4; color:#c0392b; }
  .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:1.25rem; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; }
  .stat-label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .stat-value { font-size:26px; font-weight:700; color:var(--navy); margin-top:2px; }
  .task-list { display:flex; flex-direction:column; gap:8px; }
  .task-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; display:flex; align-items:flex-start; gap:12px; box-shadow:var(--shadow); }
  .task-item.done { opacity:.5; }
  .task-item input[type=checkbox] { width:17px; height:17px; cursor:pointer; margin-top:1px; flex-shrink:0; accent-color:var(--navy); }
  .task-body { flex:1; min-width:0; }
  .task-name { font-size:14px; font-weight:500; color:var(--text); }
  .task-name.done { text-decoration:line-through; color:var(--muted); }
  .task-meta { display:flex; gap:8px; margin-top:4px; align-items:center; flex-wrap:wrap; }
  .task-ref { font-size:12px; color:var(--muted); }
  .prio { font-size:11px; font-weight:600; padding:2px 9px; border-radius:10px; }
  .prio-high{background:#fde8e8;color:#b02020;} .prio-mid{background:#fef3d8;color:#8a5c00;} .prio-low{background:#e6f9f0;color:#0d6e47;}
  .task-date { font-size:11px; color:var(--muted); }
  .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:14px; }
  .panel { display:none; } .panel.active { display:block; }
  .skeleton { background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; border-radius:8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .toast { position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:999; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; } .toast.err { background:#c0392b; }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-dot"></div>My Command Center</div>
  <div id="conn-status"><div class="dot" id="conn-dot"></div><span id="conn-label">Đang kết nối...</span></div>
</header>
<div class="tabs">
  <button class="tab active" onclick="switchTab('files',this)">📁 File Drive</button>
  <button class="tab" onclick="switchTab('tasks',this)">✅ Task đang làm</button>
</div>
<div class="content">
  <div id="files" class="panel active">
    <div class="toolbar">
      <input class="wide" id="f-name" placeholder="Tên file / folder..." />
      <input class="wide" id="f-url" placeholder="Link Google Drive..." />
      <input style="width:150px" id="f-note" placeholder="Ghi chú..." />
      <select id="f-tag">
        <option value="vti">VTI</option><option value="dcorp">Dcorp</option>
        <option value="client">Client khác</option><option value="other">Khác</option>
      </select>
      <button class="btn btn-primary" id="btn-add-file" onclick="addFile()">+ Thêm</button>
    </div>
    <div class="filter-row" id="file-filter-row">
      <span class="chip active" onclick="filterFiles('all',this)">Tất cả</span>
      <span class="chip" onclick="filterFiles('vti',this)">VTI</span>
      <span class="chip" onclick="filterFiles('dcorp',this)">Dcorp</span>
      <span class="chip" onclick="filterFiles('client',this)">Client</span>
      <span class="chip" onclick="filterFiles('other',this)">Khác</span>
    </div>
    <div id="file-grid" class="file-grid"></div>
  </div>
  <div id="tasks" class="panel">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Tổng task</div><div class="stat-value" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Đang làm</div><div class="stat-value" id="s-open">—</div></div>
      <div class="stat-card"><div class="stat-label">Hoàn thành</div><div class="stat-value" id="s-done">—</div></div>
    </div>
    <div class="toolbar">
      <input class="wide" id="t-name" placeholder="Tên task / công việc..." />
      <input style="width:150px" id="t-ref" placeholder="Mã TECH / ghi chú..." />
      <select id="t-priority">
        <option value="high">🔴 Cao</option><option value="mid" selected>🟡 Trung</option><option value="low">🟢 Thấp</option>
      </select>
      <button class="btn btn-primary" id="btn-add-task" onclick="addTask()">+ Thêm</button>
    </div>
    <div class="filter-row" id="task-filter-row">
      <span class="chip active" onclick="filterTasks('all',this)">Tất cả</span>
      <span class="chip" onclick="filterTasks('open',this)">Đang làm</span>
      <span class="chip" onclick="filterTasks('done',this)">Hoàn thành</span>
    </div>
    <div id="task-list" class="task-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const cfg = {
  url: 'https://n8n-edu.dcorp.com.vn/webhook/command-center',
  token: 'HCM-HAI-1982'
};

const TAG_LABEL = {vti:'VTI',dcorp:'Dcorp',client:'Client',other:'Khác'};
const TAG_CLS   = {vti:'tag-vti',dcorp:'tag-dcorp',client:'tag-client',other:'tag-other'};
const PRIO_LABEL = {high:'Cao',mid:'Trung',low:'Thấp'};
const PRIO_CLS   = {high:'prio-high',mid:'prio-mid',low:'prio-low'};
let allFiles=[],allTasks=[],fileFilter='all',taskFilter='all';

window.onload = () => loadAll();

// ── API: an toàn với mọi loại response ────────────────────────
async function api(body) {
  setConn('loading','Đang kết nối...');
  try {
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'X-MCC-Key': cfg.token },
      body: JSON.stringify(body)
    });

    // Với 204 No Content hoặc body rỗng → trả object rỗng, không parse
    const text = await res.text();
    if (!text || !text.trim()) {
      setConn('ok','Đã kết nối');
      return { ok: true, data: [] };
    }

    const json = JSON.parse(text);
    setConn('ok','Đã kết nối');
    return json;
  } catch(e) {
    setConn('err','Lỗi kết nối');
    showToast('Lỗi: ' + e.message, true);
    throw e;
  }
}

function setConn(s,l) {
  document.getElementById('conn-dot').className='dot '+s;
  document.getElementById('conn-label').textContent=l;
}

let toastTimer;
function showToast(msg,err) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(err?' err':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className='toast',2800);
}

function switchTab(id,btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showSkeleton(id,count,type) {
  const el=document.getElementById(id);
  if(type==='card') {
    el.innerHTML=Array(count).fill(0).map(()=>'<div class="file-card"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:12px;width:90%"></div><div class="skeleton" style="height:12px;width:40%;margin-top:8px"></div></div>').join('');
  } else {
    el.innerHTML=Array(count).fill(0).map(()=>'<div class="task-item"><div class="skeleton" style="width:17px;height:17px;border-radius:4px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:14px;width:70%;margin-bottom:6px"></div><div class="skeleton" style="height:11px;width:30%"></div></div></div>').join('');
  }
}

async function loadAll() {
  showSkeleton('file-grid',6,'card');
  showSkeleton('task-list',4,'row');
  try {
    const [fr,tr] = await Promise.all([
      api({action:'file_list'}),
      api({action:'task_list'})
    ]);
    allFiles = Array.isArray(fr.data) ? fr.data : (fr.data ? [fr.data] : []);
    allTasks = Array.isArray(tr.data) ? tr.data : (tr.data ? [tr.data] : []);
    renderFiles();
    renderTasks();
  } catch(_) {}
}

// ── FILES ─────────────────────────────────────────────────────
async function addFile() {
  const name = document.getElementById('f-name').value.trim();
  const url  = document.getElementById('f-url').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const tag  = document.getElementById('f-tag').value;
  if (!name) { document.getElementById('f-name').focus(); return; }
  const btn = document.getElementById('btn-add-file');
  btn.disabled = true;
  try {
    const res = await api({action:'file_add',name,url,tag,note});
    const nf = Array.isArray(res.data) ? res.data[0] : res.data;
    if (nf && nf.id) allFiles.unshift(nf);
    renderFiles();
    document.getElementById('f-name').value='';
    document.getElementById('f-url').value='';
    document.getElementById('f-note').value='';
    showToast('Đã thêm file ✓');
  } catch(_) {} finally { btn.disabled=false; }
}

async function delFile(id) {
  if (!confirm('Xóa file này?')) return;
  try {
    await api({action:'file_delete',id});
    allFiles = allFiles.filter(f=>f.id!=id);
    renderFiles();
    showToast('Đã xóa');
  } catch(_) {}
}

function filterFiles(val,el) {
  fileFilter=val;
  document.querySelectorAll('#file-filter-row .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderFiles();
}

function renderFiles() {
  const grid = document.getElementById('file-grid');
  const list = fileFilter==='all' ? allFiles : allFiles.filter(f=>f.tag===fileFilter);
  if (!list.length) {
    grid.innerHTML='<div class="empty-state">Chưa có file nào'+(fileFilter!=='all'?' trong nhóm này':'')+'.<br>Thêm link Drive ở thanh phía trên.</div>';
    return;
  }
  grid.innerHTML = list.map(f=>`
    <div class="file-card">
      <div class="fc-top">
        <span class="tag ${TAG_CLS[f.tag]||'tag-other'}">${TAG_LABEL[f.tag]||f.tag}</span>
        <button class="icon-btn" onclick="delFile(${f.id})" title="Xóa">✕</button>
      </div>
      <div class="fc-name">${esc(f.name)}</div>
      ${f.note ? `<div class="fc-desc">${esc(f.note)}</div>` : ''}
      ${f.url ? `<a class="fc-link" href="${esc(f.url)}" target="_blank">↗ Mở Drive</a>` : '<span class="fc-desc">Chưa có link</span>'}
    </div>
  `).join('');
}

// ── TASKS ─────────────────────────────────────────────────────
async function addTask() {
  const name     = document.getElementById('t-name').value.trim();
  const ref_code = document.getElementById('t-ref').value.trim();
  const priority = document.getElementById('t-priority').value;
  if (!name) { document.getElementById('t-name').focus(); return; }
  const btn = document.getElementById('btn-add-task');
  btn.disabled = true;
  try {
    const res = await api({action:'task_add',name,ref_code,priority});
    const nt = Array.isArray(res.data) ? res.data[0] : res.data;
    if (nt && nt.id) allTasks.unshift(nt);
    renderTasks();
    document.getElementById('t-name').value='';
    document.getElementById('t-ref').value='';
    showToast('Đã thêm task ✓');
  } catch(_) {} finally { btn.disabled=false; }
}

async function toggleTask(id) {
  try {
    const res = await api({action:'task_toggle',id});
    const u = Array.isArray(res.data) ? res.data[0] : res.data;
    const t = allTasks.find(t=>t.id==id);
    if (t && u && u.status) t.status = u.status;
    renderTasks();
  } catch(_) {}
}

async function delTask(id) {
  if (!confirm('Xóa task này?')) return;
  try {
    await api({action:'task_delete',id});
    allTasks = allTasks.filter(t=>t.id!=id);
    renderTasks();
    showToast('Đã xóa');
  } catch(_) {}
}

function filterTasks(val,el) {
  taskFilter=val;
  document.querySelectorAll('#task-filter-row .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const total = allTasks.length;
  const open  = allTasks.filter(t=>t.status==='open').length;
  const done  = allTasks.filter(t=>t.status==='done').length;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-open').textContent=open;
  document.getElementById('s-done').textContent=done;

  const list = document.getElementById('task-list');
  let filtered = taskFilter==='open' ? allTasks.filter(t=>t.status==='open')
               : taskFilter==='done' ? allTasks.filter(t=>t.status==='done')
               : allTasks;

  if (!filtered.length) {
    list.innerHTML='<div class="empty-state">Không có task nào'+(taskFilter!=='all'?' ở trạng thái này':'')+'.</div>';
    return;
  }

  const pO={high:0,mid:1,low:2};
  const sorted=[...filtered].sort((a,b)=>{
    if (a.status!==b.status) return a.status==='done'?1:-1;
    return (pO[a.priority]||1)-(pO[b.priority]||1);
  });

  list.innerHTML = sorted.map(t=>`
    <div class="task-item ${t.status==='done'?'done':''}">
      <input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask(${t.id})" />
      <div class="task-body">
        <div class="task-name ${t.status==='done'?'done':''}">${esc(t.name)}</div>
        <div class="task-meta">
          ${t.ref_code ? `<span class="task-ref">${esc(t.ref_code)}</span>` : ''}
          <span class="prio ${PRIO_CLS[t.priority]||'prio-mid'}">${PRIO_LABEL[t.priority]||t.priority}</span>
          ${t.added ? `<span class="task-date">Thêm ${t.added}</span>` : ''}
        </div>
      </div>
      <button class="icon-btn" onclick="delTask(${t.id})" title="Xóa">✕</button>
    </div>
  `).join('');
}

['f-name','f-url','f-note'].forEach(id=>
  document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') addFile(); })
);
['t-name','t-ref'].forEach(id=>
  document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); })
);
</script>
</body>
</html>
