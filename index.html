<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách tài liệu - PhamHai</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 48px auto;
    padding: 0 24px;
    color: #1f2328;
    background: #ffffff;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #656d76;
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  ul ul {
    padding-left: 22px;
    border-left: 1px solid #d1d9e0;
    margin: 4px 0 8px 10px;
  }
  li {
    margin: 2px 0;
  }
  .folder-name {
    font-weight: 600;
    padding: 6px 0;
    display: block;
    color: #1f2328;
  }
  a {
    text-decoration: none;
    color: #0969da;
    padding: 4px 0;
    display: inline-block;
  }
  a:hover {
    text-decoration: underline;
  }
  .icon {
    margin-right: 6px;
  }
  #status {
    color: #656d76;
    font-style: italic;
  }
  .error {
    color: #cf222e;
    background: #fff1f0;
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid #ffcecb;
  }
</style>
</head>
<body>
<h1>📄 Danh sách tài liệu</h1>
<div class="subtitle">Tự động cập nhật từ repo GitHub</div>
<div id="file-list"><span id="status">Đang tải danh sách...</span></div>

<script>
const owner = "phamhaidc";
const repo = "docs";       // repo hiện tại chứa các file html
const basePath = "";       // gốc của repo (vì Pages publish thẳng từ root repo "docs")

async function listDir(path) {
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`Không tải được thư mục "${path}" (HTTP ${res.status})`);
  }
  return await res.json();
}

async function renderDir(path, container) {
  let items;
  try {
    items = await listDir(path);
  } catch (err) {
    const li = document.createElement('div');
    li.className = 'error';
    li.textContent = err.message;
    container.appendChild(li);
    return;
  }

  // Sắp xếp: folder trước, file sau, theo tên
  items.sort((a, b) => {
    if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  const ul = document.createElement('ul');

  for (const item of items) {
    if (item.name.startsWith('.')) continue; // bỏ qua .DS_Store, .git...

    const li = document.createElement('li');

    if (item.type === 'dir') {
      const label = document.createElement('span');
      label.className = 'folder-name';
      label.innerHTML = `<span class="icon">📁</span>${item.name}`;
      li.appendChild(label);
      await renderDir(item.path, li); // đệ quy vào thư mục con
    } else if (item.name.toLowerCase().endsWith('.html')) {
      const relativePath = item.path; // vì basePath = "", path đã là đường dẫn tương đối đúng
      const a = document.createElement('a');
      a.href = relativePath;
      a.target = '_blank';
      a.innerHTML = `<span class="icon">📄</span>${item.name}`;
      li.appendChild(a);
    } else {
      continue; // bỏ qua file không phải .html
    }

    ul.appendChild(li);
  }

  container.appendChild(ul);
}

const listEl = document.getElementById('file-list');
listEl.innerHTML = '';
renderDir(basePath, listEl);
</script>
</body>
</html>
